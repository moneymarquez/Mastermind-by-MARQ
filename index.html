<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Marquez Mastermind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;600&display=swap" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Rewritten at runtime by useTheme.ts to match the active theme; this is
         only the value before that runs. -->
    <meta name="theme-color" content="#0b0c11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent". On iOS 26, black-translucent makes
         WebKit size the installed app's WebView to screen.height minus the
         top safe-area inset, anchored at the top — so the bottom strip of
         the screen is OUTSIDE the WebView entirely and no CSS or JS in the
         page can paint into it (WebKit bug 301108). That is the blank band
         the tab bar was floating above. "default" lays the WebView out
         edge-to-edge and lets iOS paint an opaque status bar on top, which
         is what a native app does anyway.

         iOS freezes apple-mobile-web-app-* tags at install time: an existing
         home-screen icon keeps the old value forever. Delete and re-add the
         app to pick this up — a normal deploy does not. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Masterminds" />

    <!-- iOS splash screens — without these, installed PWAs show a blank white/black
         flash on launch instead of a branded splash. One per common device size;
         iOS matches by device-width/device-height/pixel-ratio, not the image's own
         raw dimensions, so these query values must stay in sync with the actual
         device each PNG was rendered for (see public/splash/ + the generation notes
         in README). -->
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
