<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;}
  body{
    width:100vw; height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.05), rgba(255,255,255,0) 55%),
      linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0) 45%),
      linear-gradient(180deg, #141414 0%, #050505 35%, #000000 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  .mark{
    font-size: 20vw; font-weight: 900; letter-spacing: -0.05em; line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #f2f2f2 55%, #d6d6d6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub{
    margin-top: 2.4vw; font-size: 2vw; font-weight: 700; letter-spacing: 0.3em; color: #666666;
  }
</style></head>
<body>
  <div class="mark">M</div>
  <div class="sub">BY MARQ</div>
</body></html>
