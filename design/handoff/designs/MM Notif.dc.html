<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ w }}; max-width:100%; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 0 40px rgba(0,0,0,.28); overflow:hidden; font-family:Inter, system-ui, sans-serif; font-variant-numeric:tabular-nums;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 14px 10px 16px;">
    <div style="display:flex; align-items:baseline; gap:8px;"><span style="color:var(--text); font-size:15px; font-weight:600; letter-spacing:-0.015em;">Notifications</span><span style="font-size:12.5px; font-weight:500; color:var(--text-tertiary);">{{ newCount }} new</span></div>
    <div style="display:flex; align-items:center; gap:4px;">
      <span onClick="{{ markAll }}" style="height:32px; display:flex; align-items:center; padding:0 10px; border-radius:8px; color:var(--text); font-size:13px; font-weight:500; cursor:pointer;" style-hover="background:var(--surface-3);">Mark all read</span>
      <div onClick="{{ onClose }}" style="width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); cursor:pointer;" style-hover="background:var(--surface-3);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></div>
    </div>
  </div>
  <div style="max-height:{{ mh }}; overflow-y:auto; padding:0 8px 8px;">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="display:flex; flex-direction:column; padding-top:6px;">
        <span style="padding:6px 8px; font-size:12.5px; font-weight:500; color:var(--text-tertiary);">{{ g.title }}</span>
        <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="2">
          <div onClick="{{ i.tap }}" style="display:flex; align-items:center; gap:10px; min-height:{{ rowH }}px; padding:8px; border-radius:10px; cursor:pointer;" style-hover="background:var(--surface-3);">
            <div style="width:8px; flex:none; display:flex; justify-content:center;"><div style="width:7px; height:7px; border-radius:50%; background:{{ i.dot }};"></div></div>
            <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
              <span style="color:var(--text); font-size:14px; font-weight:{{ i.fw }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ i.t }}</span>
              <span style="font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ i.s }}</span>
            </div>
            <sc-if value="{{ i.hasChip }}" hint-placeholder-val="{{ false }}"><dc-import name="MM Chip" t="{{ i.chip }}" k="{{ i.k }}" hint-size="70px,22px"></dc-import></sc-if>
            <span style="font-size:12px; font-weight:500; color:var(--text-tertiary); white-space:nowrap;">{{ i.time }}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:640},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;wide&quot;],&quot;default&quot;:&quot;wide&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(target: string) =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { allRead: false };
  renderVals() {
    const p = this.props, phone = (p.size || 'wide') === 'phone';
    const go = t => () => p.onGo && p.onGo(t);
    const I = (t, s, time, to, unread, chip, k) => ({ t, s, time, tap: go(to), dot: unread && !this.state.allRead ? 'var(--accent)' : 'transparent', fw: unread && !this.state.allRead ? 600 : 500, chip, k, hasChip: !!chip });
    const groups = [
      { title: 'New leads', items: [I('Lena Ortiz · Bloom Studio', 'From email · wants a full rebrand', '12m', 'leads', 1, 'Hot', 'hot'), I('Jordan Park · Park Fitness', 'Audit form · nobody has replied', '2h', 'leads', 1, 'Waiting 2 h', 'bad')] },
      { title: 'Inbox', items: [I('Dana Lee asked to move the review', 'Portal question · Harbor Dental', '9:15', 'm2', 1), I('Sam Ruiz replied', 'Re: quote form go-live', '8:51', 'm3', 1)] },
      { title: 'Bills and deadlines', items: [I('Car insurance · $186.00', 'Card ••2290', '', 'budget', 1, '3 days overdue', 'bad'), I('Quarterly taxes · $1,600.00', 'Cash-Flow Forecast', '', 'Cash-Flow Forecast', 0, 'Due Oct 15', 'warn')] },
      { title: 'Clients', items: [I('Harbor Dental opened ticket #14', 'Booking button missing on mobile', 'Yest.', 'm5', 1), I('Bloom Studio approved logo round 1', 'Brand Lab', 'Yest.', 'Brand Lab', 0)] },
    ];
    return { groups, w: phone ? '100%' : '384px', mh: phone ? '600px' : '560px', rowH: phone ? 52 : 44, newCount: this.state.allRead ? '0' : '6', markAll: () => this.setState({ allRead: true }) };
  }
}
</script>
</body>
</html>
