<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex; align-items:center; gap:4px; padding:2px 8px 2px 6px; border-radius:999px; font-size:12px; font-weight:500; line-height:18px; white-space:nowrap; color:{{ c }}; background:{{ bg }};">
  <sc-if value="{{ iGood }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
  <sc-if value="{{ iWarn }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
  <sc-if value="{{ iBad }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5"></path><path d="M12 16.5h.01"></path></svg></sc-if>
  <sc-if value="{{ iHot }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M12 21c-4 0-7-2.7-7-6.5 0-3.2 2.3-5.2 3.6-7.6.4 1.6 1.3 2.7 2.4 3.3C11 7 12.5 4.6 15 3c-.3 3 1.2 4.6 2.4 6.3 1 1.4 1.6 3 1.6 5.2C19 18.3 16 21 12 21z"></path></svg></sc-if>
  <sc-if value="{{ iWarm }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M10 13.5V5a2 2 0 0 1 4 0v8.5a4 4 0 1 1-4 0z"></path><path d="M12 15v-4"></path></svg></sc-if>
  <sc-if value="{{ iCold }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v18"></path><path d="M4.2 7.5l15.6 9"></path><path d="M19.8 7.5l-15.6 9"></path><path d="M9.5 4.5 12 6l2.5-1.5"></path><path d="M9.5 19.5 12 18l2.5 1.5"></path></svg></sc-if>
  <sc-if value="{{ iDot }}" hint-placeholder-val="{{ false }}"><span style="width:6px; height:6px; border-radius:50%; background:{{ dot }}; border:1.5px solid {{ dotB }}; box-sizing:border-box; margin:0 1px;"></span></sc-if>
  <sc-if value="{{ iLock }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></sc-if>
  {{ t }}
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;t&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Paid&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;k&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;good&quot;,&quot;warn&quot;,&quot;bad&quot;,&quot;neutral&quot;,&quot;accent&quot;,&quot;client&quot;,&quot;live&quot;,&quot;lock&quot;,&quot;hot&quot;,&quot;warm&quot;,&quot;cold&quot;],&quot;default&quot;:&quot;good&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.k || 'neutral';
    const col = { good: 'var(--success)', warn: 'var(--warning)', bad: 'var(--danger)', accent: 'var(--accent)', client: 'var(--client-accent)', live: 'var(--success)', hot: 'var(--warning)', warm: 'var(--accent)' }[k];
    const neutral = !col;
    return {
      c: neutral ? 'var(--text-secondary)' : col,
      bg: neutral ? 'var(--surface-3)' : `color-mix(in srgb, ${col} 14%, transparent)`,
      iGood: k === 'good', iWarn: k === 'warn', iBad: k === 'bad', iLock: k === 'lock', iHot: k === 'hot', iWarm: k === 'warm', iCold: k === 'cold',
      iDot: ['neutral', 'accent', 'client', 'live'].includes(k),
      dot: k === 'neutral' ? 'transparent' : col, dotB: k === 'neutral' ? 'var(--text-tertiary)' : col,
    };
  }
}
</script>
</body>
</html>
