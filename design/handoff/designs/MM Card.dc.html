<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:{{ pad }}; box-shadow:var(--card-shadow); display:flex; flex-direction:column; gap:{{ gap }}px; min-width:0;">
  <sc-if value="{{ hasHead }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <span style="color:var(--text); font-size:15px; font-weight:600; letter-spacing:-0.015em;">{{ title }}</span>
      <span style="font-size:12px; color:var(--text-tertiary); font-weight:500; text-align:right;">{{ meta }}</span>
    </div>
  </sc-if>
  {{ children }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:160},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Card title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flush&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = this.props.flush === true || this.props.flush === 'true';
    return { hasHead: !!this.props.title, pad: f ? '18px 18px 4px' : '18px', gap: f ? 4 : 14 };
  }
}
</script>
</body>
</html>
