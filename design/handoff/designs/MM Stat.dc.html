<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; min-width:0; box-sizing:border-box; height:100%;">
  <span style="font-size:13px; font-weight:500;">{{ label }}</span>
  <span style="color:var(--text); font-size:26px; font-weight:600; letter-spacing:-0.04em; line-height:1.1; white-space:nowrap;">{{ value }}</span>
  <sc-if value="{{ hasPill }}" hint-placeholder-val="{{ true }}">
    <span style="align-self:flex-start; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:{{ w }}; color:{{ c }}; background:{{ bg }}; white-space:nowrap;">{{ pill }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:174,&quot;height&quot;:110},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Income&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$6,450&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pill&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;↑ 4.2%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;k&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;good&quot;,&quot;bad&quot;,&quot;warn&quot;,&quot;neutral&quot;],&quot;default&quot;:&quot;good&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.k || 'neutral';
    const col = { good: 'var(--success)', bad: 'var(--danger)', warn: 'var(--warning)' }[k];
    return { hasPill: !!this.props.pill, c: col || 'var(--text-secondary)', bg: col ? `color-mix(in srgb, ${col} 14%, transparent)` : 'var(--surface-3)', w: col ? 600 : 500 };
  }
}
</script>
</body>
</html>
