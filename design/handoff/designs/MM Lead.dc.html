<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:12px; padding:14px 0; border-top:{{ bt }}; min-width:0; font-family:Inter, system-ui, sans-serif;">
  <div onClick="{{ onOpen }}" style="display:flex; align-items:flex-start; gap:12px; cursor:pointer; min-width:0;">
    <div style="width:36px; height:36px; flex:none; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--text); font-size:12px; font-weight:600;">{{ ini }}</div>
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
        <span style="color:var(--text); font-size:15px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ n }}</span>
        <span style="font-size:12px; font-weight:500; color:var(--text-tertiary); white-space:nowrap;">{{ ago }}</span>
      </div>
      <span style="font-size:13px; font-weight:500; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ biz }} · {{ src }}</span>
      <div style="display:flex; flex-wrap:wrap; gap:6px; padding-top:4px;">
        <dc-import name="MM Chip" t="{{ tempT }}" k="{{ temp }}" hint-size="64px,22px"></dc-import>
        <sc-if value="{{ hasWait }}" hint-placeholder-val="{{ false }}"><dc-import name="MM Chip" t="{{ waiting }}" k="{{ waitK }}" hint-size="100px,22px"></dc-import></sc-if>
      </div>
    </div>
  </div>
  <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid; grid-template-columns:1fr 1fr 1.45fr 1fr; gap:6px;">
      <div style="height:44px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; background:var(--text); color:var(--bg); font-size:13px; font-weight:600; cursor:pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Call</div>
      <div style="height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:500; cursor:pointer;">Reply</div>
      <div onClick="{{ addCrm }}" style="height:44px; display:flex; align-items:center; justify-content:center; gap:5px; border-radius:8px; border:1px solid var(--border); color:{{ crmC }}; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;">{{ crmT }}</div>
      <div onClick="{{ onDismiss }}" style="height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border); color:var(--text-secondary); font-size:13px; font-weight:500; cursor:pointer;">Dismiss</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:358,&quot;height&quot;:150},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lena Ortiz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;biz&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bloom Studio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Inbound email&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ago&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 min ago&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;temp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hot&quot;,&quot;warm&quot;,&quot;cold&quot;,&quot;neutral&quot;],&quot;default&quot;:&quot;hot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;waiting&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;urgent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;actions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;top&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDismiss&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { crm: false };
  renderVals() {
    const p = this.props, temp = p.temp || 'warm';
    const T = { hot: 'Hot', warm: 'Warm', cold: 'Cold', neutral: 'Unscored' };
    const ini = String(p.n || '').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return {
      ini, tempT: T[temp] || 'Unscored', hasWait: !!p.waiting, waitK: p.urgent === true || p.urgent === 'true' ? 'bad' : 'warn',
      hasActions: p.actions === true || p.actions === 'true', bt: p.top === 'none' ? 'none' : '1px solid var(--grid)',
      crmT: this.state.crm ? 'In CRM ✓' : 'Add to CRM', crmC: this.state.crm ? 'var(--success)' : 'var(--text)',
      addCrm: () => this.setState({ crm: true }),
    };
  }
}
</script>
</body>
</html>
