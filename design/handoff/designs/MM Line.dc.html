<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; width:{{ w }}px; font-family:Inter, system-ui, sans-serif; font-variant-numeric:tabular-nums;">
  <svg onClick="{{ tap }}" width="{{ w }}" height="{{ svgH }}" viewBox="{{ vb }}" style="display:block; overflow:visible; cursor:crosshair;">
    <sc-for list="{{ grid }}" as="g" hint-placeholder-count="3">
      <line x1="0" x2="{{ w }}" y1="{{ g.y }}" y2="{{ g.y }}" stroke="var(--grid)" stroke-width="1"></line>
      <text x="0" y="{{ g.ty }}" font-size="10.5" font-weight="500" fill="var(--text-tertiary)">{{ g.l }}</text>
    </sc-for>
    <path d="{{ area }}" fill="{{ wash }}"></path>
    <sc-if value="{{ hasAlt }}" hint-placeholder-val="{{ false }}"><path d="{{ alt }}" fill="none" stroke="var(--cat-3)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"></path></sc-if>
    <path d="{{ solid }}" fill="none" stroke="{{ col }}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
    <sc-if value="{{ hasDash }}" hint-placeholder-val="{{ false }}">
      <path d="{{ dash }}" fill="none" stroke="{{ col }}" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"></path>
      <line x1="{{ tx }}" x2="{{ tx }}" y1="6" y2="{{ plotB }}" stroke="var(--text-tertiary)" stroke-width="1" stroke-dasharray="2 3"></line>
      <text x="{{ tx }}" y="{{ todayY }}" font-size="10.5" font-weight="500" fill="var(--text-secondary)" text-anchor="middle">Today</text>
    </sc-if>
    <circle cx="{{ ex }}" cy="{{ ey }}" r="4" fill="var(--surface)" stroke="{{ col }}" stroke-width="2"></circle>
    <text x="{{ elx }}" y="{{ ely }}" font-size="12" font-weight="600" fill="var(--text)" text-anchor="end">{{ endLabel }}</text>
    <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
      <line x1="{{ sx }}" x2="{{ sx }}" y1="6" y2="{{ plotB }}" stroke="var(--text-tertiary)" stroke-width="1"></line>
      <circle cx="{{ sx }}" cy="{{ sy }}" r="4" fill="{{ col }}"></circle>
    </sc-if>
    <sc-for list="{{ xl }}" as="x" hint-placeholder-count="3">
      <text x="{{ x.x }}" y="{{ xly }}" font-size="10.5" font-weight="500" fill="var(--text-tertiary)" text-anchor="{{ x.a }}">{{ x.l }}</text>
    </sc-for>
  </svg>
  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; top:-6px; left:{{ tipL }}px; padding:6px 9px; border-radius:8px; background:var(--surface-3); border:1px solid var(--border); color:var(--text); font-size:12px; font-weight:500; white-space:nowrap; pointer-events:none;">{{ tipT }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:322,&quot;height&quot;:150},&quot;vals&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3,4,3.5,5,4.2,6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;today&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;tsType&quot;:&quot;number&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mon,Sun&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pts&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pre&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;suf&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dec&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;end&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:140,&quot;tsType&quot;:&quot;number&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:322,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accent&quot;,&quot;client&quot;,&quot;good&quot;],&quot;default&quot;:&quot;accent&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { sel: null };
  renderVals() {
    const p = this.props, W = Number(p.w || 322), H = Number(p.h || 140);
    const vals = String(p.vals || '').split(',').map(Number), n = vals.length;
    const altV = p.alt ? String(p.alt).split(',').map(Number) : null;
    const all = vals.concat(altV || []);
    let lo = p.min != null ? Number(p.min) : Math.min(...all), hi = p.max != null ? Number(p.max) : Math.max(...all);
    const pad = (hi - lo) * 0.12 || 1; if (p.min == null) lo -= pad; hi += pad;
    const top = 14, bot = H - 22, left = 34, right = W - 6;
    const X = i => left + (i / (n - 1)) * (right - left), Y = v => top + (1 - (v - lo) / (hi - lo)) * (bot - top);
    const seg = (arr, a, b) => arr.slice(a, b + 1).map((v, j) => (j ? 'L' : 'M') + X(a + j).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const today = p.today != null && p.today !== '' ? Number(p.today) : -1;
    const solidEnd = today >= 0 ? today : n - 1;
    const pre = p.pre || '', suf = p.suf || '', dec = Number(p.dec ?? 0);
    const f = v => pre + v.toLocaleString('en-US', { maximumFractionDigits: dec, minimumFractionDigits: dec }) + suf;
    const fc = v => Math.abs(v) >= 1000 ? pre + (v / 1000).toFixed(1).replace('.0', '') + 'k' + suf : pre + Math.round(v * 10) / 10 + suf;
    const col = p.color === 'client' ? 'var(--client-accent)' : p.color === 'good' ? 'var(--success)' : 'var(--accent)';
    const wash = p.color === 'client' ? 'color-mix(in srgb, var(--client-accent) 10%, transparent)' : 'var(--accent-wash)';
    const solid = seg(vals, 0, solidEnd);
    const area = solid + ` L${X(solidEnd).toFixed(1)} ${bot} L${X(0).toFixed(1)} ${bot} Z`;
    const labels = String(p.labels || '').split(',');
    const pts = p.pts ? String(p.pts).split(',') : null;
    const xl = labels.filter(Boolean).map((l, i, a) => ({ l, x: a.length === 1 ? left : left + (i / (a.length - 1)) * (right - left), a: i === 0 ? 'start' : i === a.length - 1 ? 'end' : 'middle' }));
    const grid = [0, 0.5, 1].map(t => { const v = lo + (hi - lo) * (1 - t) * 0.92 + (hi - lo) * 0.04; const y = Y(v); return { y: y.toFixed(1), ty: (y - 4).toFixed(1), l: fc(v) }; });
    const ex = X(n - 1), ey = Y(vals[n - 1]);
    const s = this.state.sel;
    return {
      w: W, svgH: H, vb: `0 0 ${W} ${H}`, grid, area, solid, wash, col,
      hasDash: today >= 0 && today < n - 1, dash: today >= 0 ? seg(vals, today, n - 1) : '', tx: X(Math.max(today, 0)).toFixed(1), plotB: bot, todayY: bot + 14 - 30 < 0 ? 10 : 10,
      hasAlt: !!altV, alt: altV ? seg(altV, Math.max(today, 0), n - 1) : '',
      ex: ex.toFixed(1), ey: ey.toFixed(1), elx: (ex - 8).toFixed(1), ely: (ey - 10).toFixed(1), endLabel: p.end || f(vals[n - 1]),
      xl, xly: H - 4,
      hasSel: s != null, sx: s != null ? X(s).toFixed(1) : 0, sy: s != null ? Y(vals[s]).toFixed(1) : 0,
      tipL: s != null ? Math.min(Math.max(X(s) - 50, 0), W - 120) : 0,
      tipT: s != null ? `${pts ? pts[s] + ' · ' : ''}${f(vals[s])}` : '',
      tap: e => { const r = e.currentTarget.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W; const i = Math.round((x - left) / (right - left) * (n - 1)); const c = Math.max(0, Math.min(n - 1, i)); this.setState({ sel: this.state.sel === c ? null : c }); },
    };
  }
}
</script>
</body>
</html>
