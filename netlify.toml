[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Explicit function routing, ahead of the SPA catch-all below, so /api/* always
# reaches the Netlify Function regardless of redirect-priority edge cases.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: let React Router-style client-side navigation
# (and any deep link / reload) resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
