name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Typecheck worker
        run: npm run typecheck:worker
      - name: Test
        run: npm test
